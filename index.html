<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Cartera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=80">
<title>Mi Cartera</title>
<script>/* Rescate: si la app no consigue dibujarse (error de código, caché rota, datos raros), se explica en vez de quedar en blanco */
window.__errs = []; addEventListener('error', function (e) { __errs.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : '')); });
addEventListener('unhandledrejection', function (e) { __errs.push('promesa: ' + (e.reason && e.reason.message || e.reason)); });
window.__rescate = function (err) {
  var v = document.getElementById('vista'); if (!v || (v.textContent.trim() && !err)) return;
  if (err) __errs.push((err.message || String(err)) + (err.stack ? ' — ' + String(err.stack).split('\n')[1] : ''));
  v.innerHTML = '<div class="card"><h2>La app no ha podido arrancar</h2><p class="small">Tus datos siguen guardados en este dispositivo. Prueba «Reintentar»; si sigue igual, «Borrar la caché de la app» (no toca tus datos). Si persiste, envía este mensaje:</p><pre id="r-err" class="small" style="white-space:pre-wrap;background:var(--chip);padding:8px;border-radius:8px"></pre><div class="acts" style="justify-content:flex-start"><button class="btn" id="r-re">Reintentar</button><button class="btn sec" id="r-cache">Borrar la caché de la app</button><button class="btn sec" id="r-dat">Descargar copia de mis datos</button></div></div>';
  document.getElementById('r-err').textContent = (__errs.join('\n') || 'Sin detalle del error') + '\n' + navigator.userAgent;
  document.getElementById('r-re').onclick = function () { location.reload(); };
  document.getElementById('r-cache').onclick = function () { var p = []; if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })); Promise.all(p).then(function () { location.reload(); }, function () { location.reload(); }); };
  document.getElementById('r-dat').onclick = function () { var t = ''; try { t = localStorage.getItem('mi-cartera:datos:v1') || ''; } catch (e) { } if (!t) return alert('No hay datos guardados en este dispositivo.'); var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'application/json' })); a.download = 'datos-rescate.json'; document.body.appendChild(a); a.click(); };
};
</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div><h1>Mi Cartera</h1><p class="sub" id="sub">cargando…</p></div>
    <button class="icon-btn" id="btn-sync" type="button" aria-label="Estado de sincronización" title="Drive">☁</button>
    <button class="icon-btn" id="btn-ajustes" type="button" aria-label="Ajustes">⚙</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Secciones">
  <button type="button" data-tab="inicio" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
  <button type="button" data-tab="cartera"None><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Cartera</span></button>
  <button type="button" data-tab="cribado"None><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-7 9v6l-4 2v-8z"/></svg><span>Cribado</span></button>
  <button type="button" data-tab="valoracion"None><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/></svg><span>Valoración</span></button>
  <button type="button" data-tab="resultados"None><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Resultados</span></button>
  <button type="button" data-tab="informes"None><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/></svg><span>Informes</span></button>
</nav>
<main id="vista" tabindex="-1"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/logic.js?v=80"></script>

<script src="js/enlaces-ui.js?v=80"></script>

<script src="js/resultados-ui.js?v=80"></script>

<script>setTimeout(function () { var v = document.getElementById('vista'); if (v && !v.textContent.trim()) window.__rescate(); }, 4000);</script>
</body>
</html>
