name: Histórico de precios (semanal)
# Cada domingo: cierres mensuales de 12 años de cada valor de simbolos.json → datos/precios_anuales.json (múltiplos propios de cada empresa)
on:
  schedule:
    - cron: '47 6 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: datos-empresa
  cancel-in-progress: false
jobs:
  historico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar histórico de precios
        run: node scripts/historico_precios.js
      - name: Guardar
        run: |
          git config user.name "mi-cartera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos/precios_anuales.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Histórico de precios: actualización semanal"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && break || sleep 5; done
