name: Datos de empresa
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker de EE. UU. (p. ej. AZO)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: datos-empresa
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar cuentas de la SEC
        env:
          TICKER: ${{ inputs.ticker }}
        run: node scripts/datos_sec.js "$TICKER"
      - name: Guardar
        run: |
          git config user.name "mi-cartera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos de empresa: ${{ inputs.ticker }}"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && break || sleep 5; done
